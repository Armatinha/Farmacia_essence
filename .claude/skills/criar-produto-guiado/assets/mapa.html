<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mapa do produto · da ideia à publicação</title>
  <style>
    :root { color-scheme:light dark; font:16px/1.5 system-ui,sans-serif; --bg:light-dark(#f7f9fc,#101722); --ink:light-dark(#172232,#edf2fa); --muted:light-dark(#56657a,#a9b8cc); --surface:light-dark(#fff,#1b2635); --border:light-dark(#cdd7e5,#415066); --green:light-dark(#087e60,#5edbb5); --orange:light-dark(#ac5510,#f4aa61); --blue:light-dark(#3159bc,#94b8ff); --soft-green:light-dark(#e8f8f1,#173e35); --soft-orange:light-dark(#fff1e4,#482b1a); --soft-blue:light-dark(#edf2ff,#263754); }
    * { box-sizing:border-box; } body { margin:0;background:radial-gradient(circle at 8% 4%,var(--soft-blue),transparent 36%),radial-gradient(circle at 92% 22%,var(--soft-orange),transparent 30%),var(--bg);color:var(--ink);min-height:100vh; } body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 70%)} main { position:relative;max-width:1040px;margin:auto;padding:clamp(16px,4vw,40px); } h1 { font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.08;margin:2px 0 7px;letter-spacing:-.04em; } h2 { font-size:1.12rem;margin:0 0 12px; } p { margin:0;color:var(--muted); } .top { display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;padding:clamp(18px,3vw,28px);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--border);border-radius:24px;box-shadow:0 18px 60px #0f213218;backdrop-filter:blur(14px); } .eyebrow{color:var(--blue);font-size:.75rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.count { font-weight:750;color:var(--blue);background:var(--soft-blue);border:1px solid var(--blue);padding:8px 13px;border-radius:999px;white-space:nowrap } .meter { height:11px;border-radius:10px;background:var(--border);overflow:hidden;margin:16px 5px 33px;box-shadow:inset 0 1px 2px #1112 } .meter span { display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--blue),var(--orange));transition:width .3s ease; }
    .origin { display:flex;flex-direction:column;align-items:center;text-align:center; } .origin span { display:inline-flex;align-items:center;gap:8px;background:var(--soft-blue);border:2px solid var(--blue);border-radius:999px;padding:9px 18px;font-weight:780;box-shadow:0 4px 16px #3459bc1a; } .origin .guide{border-radius:16px;background:var(--surface);border-color:var(--border)} .stem { width:2px;height:24px;background:linear-gradient(var(--blue),var(--border)); } .branches { max-width:820px;margin:0 auto 22px; } .bridge { height:27px;width:66.66%;margin:auto;border:2px solid var(--border);border-bottom:0;position:relative;border-radius:12px 12px 0 0; } .bridge::before { content:'';position:absolute;height:25px;border-left:2px solid var(--border);top:-26px;left:50%; } .phases { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px; } .phase-box { position:relative;text-align:center; } .phase-box:nth-child(2)::before { content:'';position:absolute;left:50%;top:-27px;height:27px;border-left:2px solid var(--border); } .phase { width:100%;min-height:116px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:11px;align-content:center;text-align:left;padding:16px; } button { font:inherit;cursor:pointer; } .node { border:2px solid var(--border);background:color-mix(in srgb,var(--surface) 94%,transparent);color:var(--ink);border-radius:18px;padding:10px 13px;text-align:center;transition:background .18s ease,transform .18s ease,border-color .18s ease,box-shadow .18s ease;box-shadow:0 7px 24px #15243b0d;backdrop-filter:blur(10px) } .node:hover { transform:translateY(-3px);border-color:var(--blue);box-shadow:0 13px 28px #15243b1c; } .node:focus-visible { outline:3px solid var(--blue);outline-offset:3px; } .node small { display:block;color:var(--muted);font-size:.82rem;line-height:1.35; } .node[data-state="done"] { border-color:var(--green);background:var(--soft-green); } .node[data-state="active"] { border-color:var(--orange);background:var(--soft-orange);box-shadow:0 9px 28px #d47d2c2e; } .node[aria-pressed="true"] { outline:3px solid var(--blue);outline-offset:3px; } .phase .symbol { grid-row:1/3;display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:var(--soft-blue);font-size:1.25rem; } .phase[data-state="done"] .symbol { background:var(--soft-green); } .phase[data-state="active"] .symbol { background:var(--soft-orange); } .phase strong { display:block;font-size:1.06rem;align-self:end }.phase .phase-meta{align-self:start}.phase .phase-badge{grid-column:1/3;justify-self:start;margin-top:10px;padding:3px 8px;border-radius:999px;background:var(--soft-blue);color:var(--blue);font-size:.7rem;font-weight:750;text-transform:uppercase;letter-spacing:.05em}.phase[data-state="done"] .phase-badge{background:var(--soft-green);color:var(--green)}.phase[data-state="active"] .phase-badge{background:var(--soft-orange);color:var(--orange)}
    .opened { border-top:1px solid var(--border);padding-top:20px; } .opened h2 { text-align:center;letter-spacing:-.015em } .steps { display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px; } .step { min-height:48px;font-weight:650 } .step-number{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:7px;border-radius:50%;background:var(--soft-blue);color:var(--blue);font-size:.75rem}.step[data-state="done"] .step-number{background:var(--green);color:white}.step[data-state="active"] .step-number{background:var(--orange);color:white}.connector { color:var(--muted);font-weight:800 } .detail { position:relative;margin-top:22px;background:color-mix(in srgb,var(--surface) 95%,transparent);border:1px solid var(--border);border-radius:22px;padding:clamp(18px,3vw,26px);box-shadow:0 18px 50px #14233a16;overflow:hidden;backdrop-filter:blur(12px) }.detail::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--blue),var(--orange))}.detail .tag { display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft-orange);color:var(--orange);font-size:.78rem;font-weight:750;text-transform:uppercase;letter-spacing:.04em } .detail .tag[data-state="done"] { background:var(--soft-green);color:var(--green); } .detail .tag[data-state="pending"] { background:var(--soft-blue);color:var(--blue); } .detail h2 { text-align:left;margin:10px 0 16px;font-size:1.45rem;letter-spacing:-.025em } .detail dl { display:grid;grid-template-columns:120px 1fr;gap:10px 15px;margin:0; } .detail dt { color:var(--muted);font-weight:650 } .detail dd { margin:0;overflow-wrap:anywhere; } .checks { list-style:none;padding:0;margin:12px 0 0; } .checks li { padding:8px 0;border-top:1px solid var(--border); } .foot { display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:15px;font-size:.88rem; } a{color:var(--blue);font-weight:650;text-underline-offset:3px} .files{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px;margin:17px 0 0}.file{border:1px solid var(--border);padding:10px 12px;border-radius:12px;display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere;background:var(--bg)}.file small{color:var(--muted)}.file.ready{border-color:var(--green);background:var(--soft-green)}.question{margin-top:16px;padding:14px 15px;border:1px solid var(--orange);border-left:5px solid var(--orange);border-radius:12px;background:var(--soft-orange);color:var(--ink);font-weight:600}.node[data-state="review"]{border-color:var(--orange);background:var(--soft-orange)}.detail .tag[data-state="review"]{background:var(--soft-orange);color:var(--orange)}
    @media(max-width:620px) { body::before{background-size:28px 28px}.top{border-radius:18px}.count{white-space:normal}.bridge,.phase-box::before { display:none; } .phases { grid-template-columns:1fr;gap:9px; } .phase { min-height:88px; } .origin { margin-bottom:16px; } .steps { flex-direction:column; } .step{width:min(100%,340px)} .connector { transform:rotate(90deg); } .detail dl { grid-template-columns:1fr;gap:3px; } .detail dd { margin-bottom:9px; } }
    @media(prefers-reduced-motion:reduce) { .node,.meter span { transition:none; } .node:hover { transform:none; } }
  </style>
</head>
<body>
<main>
  <header class="top"><div><span class="eyebrow">Mapa vivo do produto</span><h1 id="project-title">Da ideia à publicação</h1><p id="subtitle"></p></div><div class="count" id="progress"></div></header>
  <div class="meter" role="progressbar" aria-label="Etapas concluídas" aria-valuemin="0" aria-valuemax="18" id="meter"><span id="meter-fill"></span></div>
  <div class="origin"><span>✨ SUA IDEIA</span><div class="stem" aria-hidden="true"></div><span class="guide">🧭 PERGUNTA · CRIA · REVISA</span></div>
  <div class="branches"><div class="bridge" aria-hidden="true"></div><nav class="phases" aria-label="Fases do projeto" id="phases"></nav></div>
  <section class="opened" aria-label="Etapas da fase selecionada"><h2 id="phase-title"></h2><div class="steps" id="steps"></div></section>
  <section class="detail" aria-live="polite" aria-label="Detalhes da etapa"><span class="tag" id="stage-status"></span><h2 id="stage-title"></h2><dl><dt>Agora</dt><dd id="stage-work"></dd><dt>Entrega</dt><dd id="stage-output"></dd><dt>Para avançar</dt><dd id="stage-gate"></dd><dt id="note-title" hidden>Registro</dt><dd id="stage-note" hidden></dd></dl><div id="files" class="files"></div><p id="next-question" class="question" hidden></p><div id="checklist" hidden><h2>Verificações antes de publicar</h2><ul class="checks" id="check-items"></ul></div></section>
  <p class="foot"><span>Selecione uma fase ou etapa. Verde significa entrega verificada.</span><a href="documentos.html">📚 Abrir documentos estilizados →</a></p>
</main>
<script>
  const guide=__GUIA_DATA__,stages=guide.stages,state=guide.state,completed=state.completed;
  const $=id=>document.getElementById(id);
  const phases=[{id:'Produto',title:'Produto',summary:'7 decisões → 5 guias',symbol:'💡'}, {id:'Construção',title:'Construção',summary:'Design · Frontend · Backend',symbol:'🛠️'}, {id:'Lançamento',title:'Lançamento',summary:'Segurança · Checklist',symbol:'🚀'}];
  const phaseOf=stage=>stage.group==='Produto'?'Produto':stage.group==='Construção'||stage.group==='Backend'?'Construção':'Lançamento';
  const stageState=(step,i)=>completed[step.id]?.status==='feito'?(step.audit?.length?'review':'done'):completed[step.id]?.status==='nao-aplicavel'?'done':i===state.current?'active':'pending';
  const phaseState=id=>{const indexes=stages.map((step,i)=>phaseOf(step)===id?i:-1).filter(i=>i>=0);return indexes.every(i=>stageState(stages[i],i)==='done')?'done':indexes.some(i=>i===state.current||stageState(stages[i],i)==='review')?'active':'pending'};
  $('project-title').textContent=guide.project?guide.project.replace(/[-_]+/g,' '):'Da ideia à publicação';
  $('subtitle').textContent=`${state.type==='indefinido'?'Projeto a definir':state.type==='site'?'Site':'SaaS'} · Jornada da ideia à publicação · Nível ${state.level}`;
  const verified=stages.filter((step,i)=>stageState(step,i)==='done').length;
  $('progress').textContent=`${verified} de ${stages.length} etapas verificadas`;
  $('meter').setAttribute('aria-valuemax',String(stages.length));$('meter').setAttribute('aria-valuenow',String(verified));$('meter-fill').style.width=`${100*verified/stages.length}%`;
  let phase=state.current<stages.length?phaseOf(stages[state.current]):'Lançamento';
  let selected=state.current<stages.length?state.current:stages.length-1;
  function show(i){ selected=i;const step=stages[i],entry=completed[step.id],status=stageState(step,i);
    document.querySelectorAll('.step').forEach(node=>node.setAttribute('aria-pressed',String(Number(node.dataset.index)===i)));
    $('stage-title').textContent=`${i+1}. ${step.name}`;$('stage-work').textContent=step.work;$('stage-output').textContent=step.output;$('stage-gate').textContent=step.gate;
    $('stage-status').dataset.state=status;$('stage-status').textContent=status==='review'?'! Revisar evidência':entry?entry.status==='feito'?'✓ Concluída':'— Não aplicável':i===state.current?'● Etapa atual':'○ A seguir';
    $('note-title').hidden=!entry;$('stage-note').hidden=!entry;$('stage-note').textContent=entry?.note||'';
    if(step.audit?.length){$('stage-note').textContent+=(entry?.note?' · ':'')+`Faltando: ${step.audit.join(', ')}`}
    const files=$('files');files.replaceChildren();step.artifacts.forEach(artifact=>{const row=document.createElement('div');row.className=`file${artifact.ready?' ready':''}`;const label=document.createElement(artifact.ready?'a':'span');label.textContent=artifact.path.split('/').pop();if(artifact.ready){label.href=`documentos.html?doc=${encodeURIComponent(label.textContent)}`;}const badge=document.createElement('small');badge.textContent=artifact.ready?'✓ Criado':'○ Aguardando';row.append(label,badge);files.append(row)});
    if(entry?.evidence&&!step.artifacts.some(a=>a.path===entry.evidence)){const row=document.createElement('div');row.className='file ready';const a=document.createElement('a');a.href=`../${entry.evidence}`;a.textContent='Ver evidência vinculada';row.append(a);files.append(row)}
    $('next-question').hidden=i!==state.current;$('next-question').textContent=`Próxima pergunta: ${step.question}`;
    $('checklist').hidden=step.id!=='l1';
    if(step.id==='l1'){const items=$('check-items');items.replaceChildren();guide.checks.forEach(check=>{const saved=state.checks?.[check.id],li=document.createElement('li'),badge=document.createElement('strong');badge.textContent=saved?.status==='pronto'?'✓ Pronto':saved?.status==='nao-aplicavel'?'— Não aplicável':'○ Pendente';li.append(badge,document.createTextNode(` · ${check.label}${check.critical?' · crítico':''}`));if(saved?.note){const note=document.createElement('small');note.textContent=` — ${saved.note}`;li.append(note)}items.append(li)});}
  }
  function openPhase(id){phase=id;$('phase-title').textContent=`${id} · ${phases.find(p=>p.id===id).summary}`;
    document.querySelectorAll('.phase').forEach(node=>node.setAttribute('aria-pressed',String(node.dataset.phase===id)));
    const list=$('steps');list.replaceChildren();const indexes=stages.map((step,i)=>phaseOf(step)===id?i:-1).filter(i=>i>=0);
    indexes.forEach((i,k)=>{if(k){const arrow=document.createElement('span');arrow.className='connector';arrow.setAttribute('aria-hidden','true');arrow.textContent='→';list.append(arrow)}const step=stages[i],node=document.createElement('button'),number=document.createElement('span'),label=document.createElement('span');node.type='button';node.className='node step';node.dataset.index=String(i);node.dataset.state=stageState(step,i);node.setAttribute('aria-pressed','false');number.className='step-number';number.textContent=String(i+1);label.textContent=step.name;node.append(number,label);node.addEventListener('click',()=>show(i));list.append(node)});
    show(indexes.includes(selected)?selected:indexes[0]);
  }
  phases.forEach(p=>{const box=document.createElement('div');box.className='phase-box';const node=document.createElement('button');node.className='node phase';node.type='button';node.dataset.phase=p.id;node.dataset.state=phaseState(p.id);const symbol=document.createElement('span'),label=document.createElement('strong'),summary=document.createElement('small'),badge=document.createElement('span'),indexes=stages.map((step,i)=>phaseOf(step)===p.id?i:-1).filter(i=>i>=0),done=indexes.filter(i=>stageState(stages[i],i)==='done').length,status=phaseState(p.id);symbol.className='symbol';symbol.setAttribute('aria-hidden','true');symbol.textContent=p.symbol;label.textContent=p.title;summary.className='phase-meta';summary.textContent=p.summary;badge.className='phase-badge';badge.textContent=status==='done'?'Concluída':status==='active'?`${done}/${indexes.length} · Em andamento`:`${indexes.length} etapas`;node.append(symbol,label,summary,badge);node.addEventListener('click',()=>openPhase(p.id));box.append(node);$('phases').append(box)});
  openPhase(phase);
</script>
</body>
</html>
