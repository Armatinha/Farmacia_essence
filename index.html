<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ─── Favicon & Touch Icons ─── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#171820" />

    <!-- ─── Viewport & Encoding ─── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Primary SEO (updated per-page by useSEO hook) ─── -->
    <title>Essence Pharma | Science for a Better You</title>
    <meta name="description" content="Essence Pharma delivers premium pharmaceutical compounds with full batch traceability, HPLC-verified purity ≥99%, and a public anti-counterfeiting system." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Essence Pharma" />
    <link rel="canonical" href="https://essencepharma.com/" />

    <!-- ─── Open Graph / Social ─── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Essence Pharma" />
    <meta property="og:title" content="Essence Pharma — Premium Research Compounds" />
    <meta property="og:description" content="Essence Pharma delivers premium pharmaceutical compounds with full batch traceability, HPLC-verified purity ≥99%, and a public anti-counterfeiting system." />
    <meta property="og:image" content="https://essencepharma.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://essencepharma.com/" />

    <!-- ─── Twitter Card ─── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Essence Pharma — Science for a Better You" />
    <meta name="twitter:description" content="Premium pharmaceutical compounds — traceable, verified, and anti-counterfeiting protected." />
    <meta name="twitter:image" content="https://essencepharma.com/og-image.jpg" />

    <!-- ─── Security Headers (meta fallbacks) ─── -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- ─── Sitemap hint ─── -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- ─── Google Fonts — preload critical weights ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Critical font preload (Inter 400/600 used in hero text) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Space+Mono:wght@400;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
