<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ─── Favicon & Touch Icons ─── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#171820" />

    <!-- ─── Viewport & Encoding ─── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Primary SEO (updated per-page by useSEO hook) ─── -->
    <title>Essence Pharma | Science for a Better You</title>
    <meta name="description" content="Essence Pharma delivers premium pharmaceutical compounds with full batch traceability, HPLC-verified purity ≥99%, and a public anti-counterfeiting system." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Essence Pharma" />
    <link rel="canonical" href="https://essencepharmalab.com/" />

    <!-- ─── Open Graph / Social ─── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Essence Pharma" />
    <meta property="og:title" content="Essence Pharma — Premium Research Compounds" />
    <meta property="og:description" content="Essence Pharma delivers premium pharmaceutical compounds with full batch traceability, HPLC-verified purity ≥99%, and a public anti-counterfeiting system." />
    <meta property="og:image" content="https://essencepharmalab.com/og-image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://essencepharmalab.com/" />

    <!-- ─── Twitter Card ─── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Essence Pharma — Science for a Better You" />
    <meta name="twitter:description" content="Premium pharmaceutical compounds — traceable, verified, and anti-counterfeiting protected." />
    <meta name="twitter:image" content="https://essencepharmalab.com/og-image.webp" />

    <!-- ─── Security Headers (meta fallbacks) ─── -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- ─── Sitemap hint ─── -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- ─── Hero Image Preload for Instant Public LCP ─── -->
    <script>
      if (!window.location.pathname.startsWith('/admin')) {
        const l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = '/essence-pen-box.webp';
        l.type = 'image/webp';
        l.fetchPriority = 'high';
        document.head.appendChild(l);
      }
    </script>

    <!-- ─── Critical CSS for Fast First Paint (FCP) ─── -->
    <style>
      body { background-color: #f8f5ee; color: #171820; margin: 0; }
    </style>

    <!-- ─── Google Fonts ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;background-color:#f8f5ee;color:#171820;position:relative;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(181,138,52,0.15);">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:36px;height:36px;background:#171820;border:1px solid #b58a34;border-radius:6px;display:flex;align-items:center;justify-content:center;">
              <span style="color:#b58a34;font-size:18px;font-weight:700;line-height:1;">E</span>
            </div>
            <div>
              <div style="font-size:15px;font-weight:700;letter-spacing:0.18em;color:#171820;line-height:1;">ESSENCE</div>
              <div style="font-size:8px;font-weight:600;letter-spacing:0.3em;color:#855f19;text-transform:uppercase;margin-top:2px;">PHARMA</div>
            </div>
          </div>
          <div style="width:20px;height:20px;border:2px solid #b58a34;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
