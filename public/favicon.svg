<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d0d5dc"/>
      <stop offset="70%" stop-color="#8a929e"/>
      <stop offset="100%" stop-color="#555c66"/>
    </linearGradient>
    <linearGradient id="chrome-shade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d3239"/>
      <stop offset="50%" stop-color="#5a626e"/>
      <stop offset="100%" stop-color="#c5cacf"/>
    </linearGradient>
    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b58a34"/>
      <stop offset="50%" stop-color="#e9c878"/>
      <stop offset="100%" stop-color="#b58a34"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark luxury badge background -->
  <rect width="120" height="120" rx="26" fill="#0d1014"/>
  <rect width="118" height="118" x="1" y="1" rx="25" fill="none" stroke="#242a32" stroke-width="1.5"/>

  <!-- Folded Ribbon "E" Logo Mark -->
  <g filter="url(#shadow)" transform="translate(14, 16)">
    <!-- Top wing -->
    <path d="M 32 10 L 76 10 L 52 32 L 32 32 Z" fill="url(#chrome-grad)" />
    <path d="M 52 32 L 76 10 L 62 10 L 40 32 Z" fill="url(#chrome-shade)" opacity="0.65" />

    <!-- Middle bar fold -->
    <path d="M 26 28 L 62 28 L 44 48 L 26 48 Z" fill="url(#chrome-grad)" />
    <path d="M 44 48 L 62 28 L 52 28 L 34 48 Z" fill="url(#chrome-shade)" opacity="0.6" />

    <!-- Bottom fold and loop -->
    <path d="M 18 44 L 38 44 L 28 66 L 58 66 L 46 80 L 18 80 Z" fill="url(#chrome-grad)" />
    <path d="M 28 66 L 58 66 L 46 80 L 18 80 Z" fill="url(#chrome-shade)" opacity="0.75" />
    <path d="M 18 44 L 28 66 L 22 72 L 14 54 Z" fill="url(#chrome-shade)" opacity="0.9" />
  </g>

  <!-- Gold subtle base line -->
  <rect x="35" y="104" width="50" height="2" rx="1" fill="url(#gold-line)" />
</svg>